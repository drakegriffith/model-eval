# The product's own manifest -- ticket 38, slice S7 of the 14b playground spec,
# under repo shape B' (14b-repo-boundary-doctrine-consult §8): core package plus
# an isolated product directory with its own manifest, same repo, one import
# gate. The gate is runner/import_gate.py (ticket 33, closed); this directory is
# what gives its half B something to inspect.
#
# WHAT THIS MANIFEST IS FOR. It makes product/ a unit with a name, an entry point
# and a declared dependency set, so that what the product may reach is written
# down rather than inherited from whatever happens to sit next to it on the
# import path.
#
# HOW THE CORE IS SUPPLIED, and why it is not under [project.dependencies].
# The core has no distribution yet: there is no repo-root manifest, and no index
# or git remote for a requirement to resolve against (consult §7 -- zero remotes,
# no packaging). So the core arrives on the import path from the environment:
#
#     PYTHONPATH=<repo>/product:<repo>/runner python3 -m gauntlet_playground
#
# Product code must never put it there itself. sys.path manipulation inside
# product/ is the F3 defect pattern runner/ladder_from_results.py:40-41 already
# carries once; import_gate.py half B and runner/tests/test_product_boundary.py
# are what keep it at once. The point of holding the line is that packaging the
# core later -- a repo-root manifest exposing exactly the five core modules and
# nothing else -- changes this invocation and not one line of product code.
#
# WHAT AN INSTALL OF THIS MANIFEST DOES NOT GIVE YOU. `pip install -e product/`
# installs the product and its console script; it does NOT install the core, so
# the entry point still needs the core on the path and says so when it is
# missing. Verified once by install rather than assumed.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet-playground"
version = "0.1.0"
description = "The model-gauntlet product surface: what a visitor runs, held behind the core boundary."
# Floor, not a tested matrix: the product's stdlib use is unremarkable and the
# only interpreter it has been run on is the host's 3.14.
requires-python = ">=3.10"
dependencies = []

# matplotlib is an extra, not a dependency, because the split it mirrors is
# load-bearing: surface.py (the data half, every sentence and every number) is
# stdlib-plus-core and must import WITHOUT matplotlib installed -- that is what
# lets runner/tests/test_result_surface.py prove the honesty argument in an
# environment with no third-party packages. Only render.py (the drawing half)
# and the chart script below need it. Moving it into [project.dependencies]
# would make the whole product require a plotting library to state its claims.
[project.optional-dependencies]
chart = ["matplotlib>=3.8"]

[project.scripts]
gauntlet-playground = "gauntlet_playground.__main__:main"
# Ticket 40, slice S2. A second script rather than a subcommand of the first:
# the two report different things (the boundary vs the executor's invocation
# paths and the spend cap's coverage) and runner/tests/test_product_boundary.py
# pins the line above byte-for-byte, so growing it into an argv-dispatching
# entry point would move a line another test is holding still.
gauntlet-playground-run = "gauntlet_playground.executor:main"
# Ticket 44, slice S4. A third script for the same reason the second is one:
# __main__.py's report is pinned byte-for-byte by test_product_boundary.py, so
# the chart cannot be a subcommand of it. Lives in render.py because saving a
# PNG is the drawing half's job and the only one that needs the chart extra.
gauntlet-playground-chart = "gauntlet_playground.render:main"
# Ticket 41, slice S6. Same reasoning: the intake form stores submissions and
# runs nothing, a different report than either script above.
gauntlet-playground-intake = "gauntlet_playground.intake:main"

[tool.setuptools]
packages = ["gauntlet_playground"]
