# client_timeout_ms (optional, issue #40): the value run.py's local-family
# child gets for both CLAUDE_STREAM_IDLE_TIMEOUT_MS and API_TIMEOUT_MS.
# claude-code's own client-side stream-idle timer defaults to roughly 200s and
# aborts a turn on silence alone, which a model that reasons for minutes
# before emitting visible content (GLM 4.7 measured 32 min on one turn) trips
# long before it has failed anything. Set this only from a measurement of how
# slow THIS row's reasoning actually runs; absent (or null), run.py falls back
# to the run's own resolved wall-clock cap in ms, which is always at least as
# large since the subprocess is killed there regardless. Validated by
# serving_registry.load_rows() as a positive int when present.
models:
  - model: glm-4.7
    driver: claude-code
    serving:
      parallel: 1
      context_length: 131072
      max_tokens_floor: 8192
      temperature: 0
      seed: 42
      quant: unknown
    capabilities:
      subagents: true
      hooks: true
      tools: unknown
    max_harness_level: 5
    deterministic_loops: true
    noise_probe:
      flip_rate: 0.0
      date: 2026-08-26
      identical: 5
      of: 5
    reasoning_probe:
      cap_tokens: 600
      empty: 5
      of: 6
      date: 2026-08-25
    permission:
      mode: bypassPermissions
      authorization: "regarding this tool using Claude mode GLM seats, I want my Claude to have the ability to use models like GLM. If you want to invoke a quick Opus 5 agent in the backend to do that, I allow you to bypass and make it happen on the Mac Studio and this computer."
      authorized_date: 2026-08-25
    timeout:
      prefill_tok_s_min: 57.0
      prefill_tok_s_max: 71.0
      basis: "turn cap derived from prefill rate x prompt size; wall-clock expiry logs its own status, never a task fail"
    notes: "SEAT-MEASURED 2026-08-25 panel. max_tokens floor 8192: at a 600-token cap 5/6 probes returned empty content because GLM reasoning tokens consume max_tokens. quant: NOT MEASURED by the panel; issue #8 says 'a Q3 local model' in prose, which is not a measurement, so it stays unknown and refuses comparison until probed."
