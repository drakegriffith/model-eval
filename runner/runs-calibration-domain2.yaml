# runs-calibration-domain2.yaml — ticket 23's domain-2 calibration for the three
# authored adversarial-convention / legacy-interop tasks (t5-py-a, t5-py-b,
# t5-ts-a, authored at b4ba816).
#
# THIS IS NOT THE SWEEP, and it is not a second t4 calibration either. Per the
# sealed pre-registration section 1, calibration is exploratory instrument
# characterisation. Its estimand is a property of the TASKS (pooled roster pass
# rate per task against 05's bands: Easy >= 0.95, Medium 0.50-0.95, Hard <=
# 0.50), not of any configuration. Ticket 23 section 1 narrows what this
# particular round may do further still: it may assign tiers and answer the
# domain question, and nothing else. It makes no inferential claim about domain
# -- 19 section 1 rules `domain: 2` a reporting facet, and any inferential
# statement about domain needs a committed section 0 amendment first. It never
# pools with v2 sweep data, and it never pools with the t4 calibration.
#
# SEPARATE RESULTS FILE. Run to runner/results/calibration-domain2.jsonl, not
# to calibration.jsonl and not to results.jsonl, so the stratum separation the
# pre-registration section 1 firewall requires is physical rather than a
# convention -- the same reason 05's round wrote its own file.
#
# ROSTER — 4 model ids, ONE effort tier each, 3 reps, 3 tasks = 36 runs.
# Identical to runs-calibration.yaml, and the reasoning is copied because the
# reasoning is what makes the two rounds comparable. Ticket 23 section 3 fixes
# the shape as "matching runs-calibration.yaml's roster and its reasoning".
#
#   1. The calibration statistic is pooled across the roster. A second effort
#      tier for a model already present adds no roster breadth -- it reweights
#      one model to 2x in the pool. Breadth is what makes "pooled roster pass
#      rate" an honest estimate of "the roster fails this task".
#   2. Effort is the SWEEP's manipulated axis, not calibration's. T13 measured
#      76 low-effort runs with zero failures: the dial moves tau, not pi. Buying
#      a second tier here buys a pi axis that has never moved.
#
# WHICH tier, and why the stronger one: codex runs at `high`, not `low`. A task
# calibrated at a starved effort budget would be declared Hard for an instrument
# reason rather than a task reason -- the error 05 section 2 settled on the
# low-effort dial and 17 section 4 rejected as option (iii). Calibrating at each
# model's stronger credited tier biases AGAINST declaring a task Hard, which is
# the direction that costs the author something. That bias matters more here
# than it did on t4: under ticket 23 section 1 a single failure puts the domain
# hypothesis live, so the roster must be given its strongest honest shot before
# any failure is read as being about the domain. claude-haiku-4-5 runs at `low`
# because that is the single tier the sweep buys it, and T13 measured its dial a
# NO-OP at 1.06-1.08x, so low ~ high for it regardless.
#
# KIMI IS ABSENT for exactly the reason it was absent on the t4 round, and it is
# a capability gap, not a choice. run.py's registry routes family `kimi` to the
# `claude` binary with an injected Moonshot key (run.py:507). Pre-reg section 8
# exclusion 3 rules that path a SEPARATE STRATUM from the native `kimi` binary,
# and precondition 4 (ticket 20, OPEN) still has not delivered a native
# invocation path. Running Kimi today would spend real money to produce a
# v1-stratum row that cannot pool with anything -- including with the other 36
# rows in this very file. Consequence, stated rather than silently dropped: the
# pooled rate is over 4 of the sweep's 5 model ids, disclosed with its n, and
# the Kimi cell renders as not-yet-run (n = 0).
#
# TIMEOUT — BOTH KEYS AT 3600, and this is the load-bearing config line.
# t5 tasks fall to the t1/t2 branch (run.py:1000 keys tier3 on the literal
# "t3"), which is 1200 s; ticket 23 section 5 says so explicitly and forbids
# fixing it here -- that is ticket 22 defect 2's job, and this is a config-level
# patch that leaves the trap armed. Raised to 3600 s, the t3 value, on both keys
# so neither branch can bite. Cap-terminated runs score as FAILURES under the
# estimand, and under ticket 23 section 1 any failure at all puts the domain
# hypothesis live -- so a mis-sized cap would manufacture a domain-2 "failure"
# out of an instrument property and get read as a result. The t4 round's longest
# run was 481 s against a 375 s corpus maximum; the margin is not worth leaving
# to chance a second time when the decision rule is this sharp.
# (Both defects named above have since landed. resolve_timeout_s() now raises on
# a tier with no cap declared for it, and timeout_t5_s below states this sweep's
# 3600 s directly instead of borrowing the t1/t2 key. The rows this file produced
# are unaffected -- the cap they ran under was 3600 s either way.)
#
# LOC_CHANGED. Ticket 22 defect 1 was open when this sweep ran: run.py diffed the
# index against HEAD, so the field read 0 for any run whose model committed its
# own work. Every t4 calibration row read 0 for that reason, and so did these.
# Fixed after the fact in e622831 (anchored on the base commit) -- the fix is not
# retroactive, so do not quote the field on any row in this sweep.
#
# Protocol v2: brokered (K=10), sealed task dir, untamperable grader. Bare
# scaffold -- harness: false -- so no scaffold confound enters a task-property
# measurement.

defaults:
  timeout_t1_t2_s: 3600
  timeout_t3_s: 3600
  # Ticket 22 defect 2, added after this sweep ran. Same story as the t4 round:
  # the 3600 s the t5 tasks actually got came from the raised t1/t2 key, so
  # declaring it for t5 directly leaves the calib-d2 rows exactly replayable.
  timeout_t5_s: 3600
  seed: 1337
  k_acceptance: 10

sweeps:
  - name: calib-d2
    harness: false
    reps: [1, 2, 3]
    tasks: [t5-py-a, t5-py-b, t5-ts-a]
    configs:
      - {model: gpt-5.6-sol, effort: high}
      - {model: gpt-5.6-luna, effort: high}
      - {model: gpt-5.3-codex-spark, effort: high}
      - {model: claude-haiku-4-5, effort: low}
